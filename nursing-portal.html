<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة طاقم التمريض | Apex Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f8f8;
    --surface: #ffffff;
    --ink: #12333a;
    --muted: #5b7479;
    --line: #dbe8e9;
    --brand: #0f766e;
    --brand-dark: #0b5a54;
    --accent: #14b8a6;
    --shadow: 0 10px 30px rgba(15, 118, 110, .10);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1a1d; --surface: #112529; --ink: #e8f3f3; --muted: #93aeb2;
      --line: #1f3a3f; --brand: #2dd4bf; --brand-dark: #5eead4; --accent: #14b8a6;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    line-height: 1.6;
  }
  html[lang="en"] body { font-family: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif; }
  .wrap { max-width: 1040px; width: 100%; margin: 0 auto; padding: 20px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--brand); }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--accent)); color: #fff; font-size: 20px;
  }
  .lang-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .lang-btn:hover { border-color: var(--brand); transform: translateY(-1px); }
  .hero { text-align: center; padding: 48px 8px 36px; }
  .hero h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); font-weight: 700; line-height: 1.3; }
  .hero p { color: var(--muted); margin-top: 10px; font-size: 1.05rem; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px 24px; text-decoration: none; color: inherit; box-shadow: var(--shadow);
    transition: transform .25s, border-color .25s, box-shadow .25s; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; height: 5px;
    background: linear-gradient(90deg, var(--brand), var(--accent));
  }
  .card:hover, .card:focus-visible { transform: translateY(-6px); border-color: var(--accent); outline: none; }
  .card:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  .icon {
    width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--brand);
  }
  .icon svg { width: 30px; height: 30px; }
  .card h2 { font-size: 1.25rem; font-weight: 700; }
  .card p { color: var(--muted); font-size: .97rem; flex: 1; }
  .cta { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--brand); }
  .cta svg { width: 18px; height: 18px; transition: transform .2s; }
  [dir="rtl"] .cta svg { transform: scaleX(-1); }
  .card:hover .cta svg { transform: translateX(4px); }
  [dir="rtl"] .card:hover .cta svg { transform: scaleX(-1) translateX(4px); }
  footer { text-align: center; color: var(--muted); font-size: .62rem; line-height: 1.7; margin-top: auto; padding-top: 40px; opacity: .85; }
  footer .credit { display: block; direction: ltr; letter-spacing: .02em; }
  body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 14px; } .hero { padding: 28px 4px 24px; } }
  @media (max-width: 480px) {
    .wrap { padding: 14px 14px 14px; }
    .brand-mark { width: 36px; height: 36px; font-size: 18px; }
    .lang-btn { padding: 9px 16px; min-height: 40px; }
    .hero h1 { font-size: 1.6rem; }
    .hero p { font-size: .95rem; }
    .card {
      display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 4px;
      padding: 18px 16px; align-items: center;
    }
    .icon { width: 52px; height: 52px; grid-row: 1 / span 3; }
    .icon svg { width: 26px; height: 26px; }
    .card h2 { font-size: 1.08rem; }
    .card p { font-size: .88rem; }
    .cta { font-size: .9rem; }
    .card:hover { transform: none; }
    .card:active { transform: scale(.98); border-color: var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language"></button>
  </div>

  <header class="hero">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <main class="grid">
    <a class="card" href="https://apexa5521-hue.github.io/supply-requestClinic/Index.html" target="_blank" rel="noopener noreferrer">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>
      <h2 data-i18n="c1t"></h2>
      <p data-i18n="c1d"></p>
      <span class="cta"><span data-i18n="open"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" href="https://training.qiblib.com/" target="_blank" rel="noopener noreferrer">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></span>
      <h2 data-i18n="c2t"></h2>
      <p data-i18n="c2d"></p>
      <span class="cta"><span data-i18n="open"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" href="https://apexa5521-hue.github.io/ApexNurseReport/index.html" target="_blank" rel="noopener noreferrer">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="M9.5 13.5L12 11l2.5 2.5"/></svg></span>
      <h2 data-i18n="c3t"></h2>
      <p data-i18n="c3d"></p>
      <span class="cta"><span data-i18n="open"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" href="https://apexa5521-hue.github.io/survnursform/survey_en.html" target="_blank" rel="noopener noreferrer">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/></svg></span>
      <h2 data-i18n="c4t"></h2>
      <p data-i18n="c4d"></p>
      <span class="cta"><span data-i18n="open"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </main>

  <footer>
    <span class="credit">Built and developed by Mr.IbrahimAlluhaydi</span>
  </footer>
</div>

<script>
  const T = {
    ar: {
      title: "بوابة طاقم التمريض",
      subtitle: "اختر الخدمة التي تريدها للوصول إليها مباشرة",
      c1t: "منصة الطلبات",
      c1d: "ارفع طلبات المستلزمات من العيادة إلى المستودع، وتابع حالة طلباتك.",
      c2t: "منصة تدريب الممرضات",
      c2d: "المحتوى التدريبي والاختبارات لتطوير مهاراتك ومعرفتك السريرية.",
      c3t: "رفع التقارير الأسبوعية",
      c3d: "سجّل تقريرك الأسبوعي وارفعه في موعده بسهولة.",
      c4t: "تقييم الجودة",
      c4d: "شاركنا رأيك في بيئة العمل عبر استبيان قصير.",
      open: "فتح المنصة",
      btn: "English", pageTitle: "بوابة طاقم التمريض | Apex Care"
    },
    en: {
      title: "Nursing Staff Portal",
      subtitle: "Choose a service to access it directly",
      c1t: "Supply Requests Platform",
      c1d: "Submit clinic supply requests to the warehouse and track their status.",
      c2t: "Nurse Training Platform",
      c2d: "Training content and quizzes to build your clinical skills and knowledge.",
      c3t: "Weekly Report Submission",
      c3d: "Record your weekly report and submit it on time with ease.",
      c4t: "Quality Survey",
      c4d: "Share your feedback on the workplace through a short survey.",
      open: "Open platform",
      btn: "العربية", pageTitle: "Nursing Staff Portal | Apex Care"
    }
  };

  function apply(lang) {
    const d = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = d.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n]; });
    document.getElementById("langBtn").textContent = d.btn;
    try { localStorage.setItem("nursing-portal-lang", lang); } catch (e) {}
  }

  let lang = "ar";
  try { lang = localStorage.getItem("nursing-portal-lang") || "ar"; } catch (e) {}
  if (!T[lang]) lang = "ar";
  apply(lang);

  document.getElementById("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    apply(lang);
  });
</script>
</body>
</html>
